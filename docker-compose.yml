services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arakutribe
      POSTGRES_PASSWORD: arakutribe
      POSTGRES_DB: arakutribe
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arakutribe"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://arakutribe:arakutribe@db:5432/arakutribe
      JWT_SECRET: change-me-to-a-long-random-string
      CORS_ORIGINS: http://localhost:5173
      UPLOADS_DIR: /app/uploads
      # Bootstraps the first superadmin on startup (see app/seed_admin.py).
      # Dev-only default credentials — change these for anything beyond local use.
      ADMIN_EMAIL: admin@arakutribe.com
      ADMIN_PASSWORD: changeme123
      # AI shopping assistant — set in your shell or a .env file next to this
      # compose file (never commit a real key). Left unset, the chat widget
      # shows a clear "not configured" error instead of failing silently.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # "Sign in with Google" — same .env-at-repo-root pattern as above.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/auth/google/callback}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      # Transactional email (Resend) — same pattern.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Araku Tribe <onboarding@resend.dev>}
      CONTACT_NOTIFICATION_EMAIL: ${CONTACT_NOTIFICATION_EMAIL:-}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  db_data:
  uploads_data:
